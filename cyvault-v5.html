<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CyVault – Digital Risk Protection</title>
<style>
:root{--bg:#0e0e11;--cd:#18181d;--bd:#2e2e36;--tx:#f2f2f4;--mu:#9a9aa5;--ac:#ff2a2a;--hi:#ff2a2a;--md:#b4b4be;--lo:#5c5c66;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#eeeeef;--cd:#fff;--bd:#d6d6da;--tx:#1a1a1f;--mu:#6a6a74;--ac:#d91f1f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}nav a{padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--mu);font-size:13px}nav a:hover,nav a.on{background:var(--cd);color:var(--ac)}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;box-shadow:0 4px 18px #0003;transition:.2s}.card:hover{transform:translateY(-2px)}
.g{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;transition:.2s}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.r{background:var(--hi);color:#fff}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:9px;padding:9px;font:inherit;margin:4px 0 10px}
label{font-size:12px;color:var(--mu)}h1{font-size:clamp(28px,5vw,46px);margin:.2em 0}h2{margin:.2em 0 .6em}h3{margin:0 0 8px}.mu{color:var(--mu)}
.b{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#fff;white-space:nowrap}.Critical{background:#a50021}.High{background:#ff6138}.Medium{background:#d4a62a}.Low{background:#26a269}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);font-size:13px}th{cursor:pointer;color:var(--mu)}tr.k:hover{background:#ff2a2a14;cursor:pointer}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.big{font-size:30px;font-weight:800}
#msgs{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}.m{padding:9px 12px;border-radius:12px;max-width:85%}.m.u{background:var(--ac);color:#fff;align-self:flex-end}.m.a{background:var(--bg);border:1px solid var(--bd)}
pre{white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:10px;border:1px solid var(--bd);font:13px/1.5 ui-monospace,monospace}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:8px 18px;border-radius:10px;display:none;z-index:9}
.shell{display:flex;min-height:100vh}.cnt{flex:1;min-width:0}
aside{width:230px;flex:none;background:linear-gradient(180deg,#7a1218,#0e0e11);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
aside .lg{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;margin-bottom:4px}aside .lg img{width:36px;height:36px;border-radius:9px}
.sb{display:block;padding:11px 12px;margin:6px 0;border-radius:11px;background:#ffffff14;cursor:pointer;font-weight:600;font-size:14px;transition:.2s}.sb:hover{background:#ffffff2a;transform:translateX(3px)}.sb.on{background:linear-gradient(90deg,#ff2a2a,#b01818);color:#fff}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px 0}
@media(max-width:760px){.shell{display:block}aside{width:100%;height:auto;position:static}.nv{display:flex;overflow-x:auto;gap:6px}.sb{white-space:nowrap;margin:4px 0}}
#splash{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99;transition:opacity .8s;cursor:pointer}#splash img{max-width:min(92vw,70vh);max-height:70vh;border-radius:14px;animation:logoIn 1.5s cubic-bezier(.2,.9,.3,1.15) both,ripple 2.4s ease-out 1.5s infinite,glow 2.4s ease-in-out 1.5s infinite}@keyframes logoIn{0%{opacity:0;transform:scale(.35) rotate(-14deg);filter:blur(14px) brightness(2)}55%{opacity:1;transform:scale(1.1) rotate(3deg);filter:blur(0) brightness(1.3)}80%{transform:scale(.97) rotate(-1deg)}100%{opacity:1;transform:none;filter:none}}@keyframes ripple{0%{box-shadow:0 0 0 0 rgba(255,42,42,.55)}100%{box-shadow:0 0 0 42px rgba(255,42,42,0)}}@keyframes glow{0%,100%{filter:drop-shadow(0 0 6px rgba(255,42,42,.35))}50%{filter:drop-shadow(0 0 30px rgba(255,42,42,.95))}}@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
#cc{position:static;width:100%;max-width:760px;margin-top:14px;padding:0 20px;text-align:center;color:#fff;font:italic 600 clamp(14px,2.6vw,22px)/1.4 system-ui,sans-serif;text-shadow:0 2px 12px #000;animation:fi 2s ease .6s both}#cc small{display:block;margin-top:6px;font-style:normal;font-weight:500;font-size:.65em;color:#ff6b6b}@keyframes fi{from{opacity:0}to{opacity:1}}
</style><!--<base target="_blank">--><base href="." target="_blank">

 const wk=[...Array(12)].map((_,i)=>fl.filter(x=>x.wk==i).length),mx=Math.max(...wk,1),tot=s.t;let off=0;const col={Critical:'#a50021',High:'#ff2a2a',Medium:'#b4b4be',Low:'#5c5c66'};

 <div class="tw"><table><tr>${[['platform','Platform'],['name','Name'],['score','Risk'],['type','Type'],['status','Status']].map(c=>`<th onclick="S.sort='${c[0]}';render()">${c[1]} ↕</th>`).join('')}</tr>${L.slice(0,60).map(x=>`<tr class="k" onclick="go('detail','${x.id}')"><td>${x.platform}</td><td>${esc(x.name)}</td><td>${x.score} ${bd(x.level)}</td><td>${x.type}</td><td>${x.status}</td></tr>`).join('')||'<tr><td colspan=5 class="mu">No matching items.</td></tr>'}</table></div></div>`}

function analyzeQ(v,sec,ex){const l=v.toLowerCase().replace('@',''),f=ALL.find(x=>x.name.toLowerCase().replace('@','')==l);let r,k;

  else if(sec=='sites'||(!sec&&v[0]!='@'&&/\.[a-z]{2,}(\/|$)/i.test(v))){r=urlRisk(v);k='sites'}
  else{ex=ex||{};r=azAcc({handle:l,display:l,fo:ex.fo??1000,fg:ex.fg??300,age:ex.age??999,bio:ex.bio||'',link:ex.link||'',logo:ex.logo||0,real:!!ex.real,posts:ex.posts??5,ver:ex.ver});if(!ex.age&&ex.age!==0)r.reasons.push('Only limited details were given, so account age and followers were not scored');k='social'}

function apk(){return`<h2>APK scanner</h2><p class="mu">Static check inside your browser. The file is never uploaded. It reads the package contents and requested permissions, then scores scam and malware signals. It does not run the app.</p><div class="card"><div class="g g2"><div><label>APK file</label><input id="af" type="file" accept=".apk,application/vnd.android.package-archive"><label>Where did you get it?</label><select id="asrc"><option>Google Play</option><option>Brand official website</option><option>Third-party app store</option><option>Link from SMS / social media</option><option>WhatsApp / Telegram file</option></select></div><div><label>No file? Paste the requested permissions</label><textarea id="ap" rows="3" placeholder="SEND_SMS, READ_SMS, BIND_ACCESSIBILITY_SERVICE"></textarea><label>App name it claims to be (optional)</label><input id="an"></div></div><button class="btn" onclick="runApk()">📦 Scan APK</button></div>${SCANS.filter(x=>x.kind=='APK').map(scanCard).join('')}`}

function pdfLines(){const s=stat(),L=[],R=[200,30,30],G=[90,90,100],h=t=>{L.push([' ',6,0,0]);L.push([t,15,1,3,R,[255,236,236]])},p=(t,g,c)=>L.push([t,10,0,g==null?2:g,c]),lab=(t,c)=>L.push([t,10,1,1,c||[0,0,0]]);
